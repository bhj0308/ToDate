# Render blueprint — one-click-ish deploy of the ToDate demo (backend + web client).
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render → "New +" → "Blueprint" →
# pick the repo. Render reads this file. The demo runs on SQLite by default
# (ephemeral — state resets on redeploy, which is fine for a demo). For durable
# multi-user state, uncomment the Postgres database block and the DATABASE_URL
# env var below.

services:
  - type: web
    name: todate-demo
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: "development"   # keeps the open sign-in + dev OTP demo flow
      - key: JWT_SECRET
        generateValue: true    # Render generates a strong secret
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: todate-db
      #     property: connectionString

# databases:
#   - name: todate-db
#     plan: free
#     # NOTE: set DATABASE_URL above to the async form. Render's connectionString
#     # is postgresql://… — the app needs postgresql+asyncpg://…, so either add a
#     # small env rewrite or set DATABASE_URL manually to the +asyncpg URL.
